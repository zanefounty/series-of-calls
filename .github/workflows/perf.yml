name: Performance

# Times the PR against its base on a very large network, headless and in Chrome (desktop and a throttled phone),
# and uploads the tables as reviewable artifacts. Fork runs require maintainer approval
# in repository settings, then run with read-only permissions.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'site/**'
      - 'scripts/lib/**'
      - 'scripts/perf-*.js'
      - 'tests/fixtures/**'
      - 'tests/harness.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Base version of the game
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          # The base's page, assembled by the base's own scripts (or its site/index.html from before the split).
          node scripts/lib/page.js --ref FETCH_HEAD -o "$RUNNER_TEMP/base.html"
          echo "BASE_HTML=$RUNNER_TEMP/base.html" >> "$GITHUB_ENV"
      - name: Benchmark
        # The runner image ships Google Chrome; playwright-core (a dev dependency) drives it, no browser download.
        run: |
          PERF_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          export PERF_CHROME
          echo "Chrome: $PERF_CHROME ($("$PERF_CHROME" --version))"
          base_args=()
          if [ -n "${BASE_HTML:-}" ]; then base_args=(--base "$BASE_HTML"); fi
          node scripts/perf-bench.js "${base_args[@]}" --browser --md perf.md --summary "$GITHUB_STEP_SUMMARY"
      - name: Remember the PR number
        if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: echo "$PR" > pr-number.txt
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: perf
          path: |
            perf.md
            pr-number.txt
          retention-days: 7
