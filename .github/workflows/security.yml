name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: bash scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - run: python3 scripts/check-pages-artifact.py _site
      - run: python3 scripts/check-secrets.py --gitleaks "$RUNNER_TEMP/gitleaks" --artifact _site
      - name: Security regression tests
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: python3 -m unittest tests.security_scan_test tests.pages_artifact_test -v
