name: Accountability
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: acceptance producer ${{ matrix.part }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Remove checked-in receipts before producer execution
        run: rm -f evidence/acceptance.json evidence/communications.tap evidence/recorder.log
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record acceptance evidence
        run: |
          set -o pipefail
          python3 scripts/record-evidence.py --shard ${{ matrix.part }}/8 2>&1 | tee evidence/recorder.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-part-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/acceptance.json
            evidence/communications.tap
            evidence/recorder.log
          if-no-files-found: warn
          retention-days: 14

  acceptance-merge:
    name: complete acceptance evidence
    needs: [acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Remove checked-in receipts before artifact assembly
        run: rm -f evidence/acceptance.json evidence/communications.tap evidence/recorder.log
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: acceptance-part-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-parts
      - name: Require every actual shard and assemble the complete receipt
        run: |
          set -o pipefail
          python3 scripts/record-evidence.py --merge-shards acceptance-parts --shard-count 8 2>&1 | tee evidence/recorder.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/acceptance.json
            evidence/communications.tap
            evidence/recorder.log
            evidence/acceptance-shards/
          if-no-files-found: warn
          retention-days: 14

  gates:
    name: development gates ${{ matrix.part }}/8
    needs: [acceptance-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Clear gate output paths before installation
        run: rm -f evidence/gates.log evidence/gates-install.log
      - name: Remove checked-in receipts before artifact download
        run: rm -f evidence/acceptance.json evidence/communications.tap
      - uses: actions/download-artifact@v8
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies for the evidence gate rerun
        run: |
          set -o pipefail
          npm ci 2>&1 | tee evidence/gates-install.log
      - name: Require this run's acceptance receipts
        run: |
          test -s evidence/acceptance.json
          test -s evidence/communications.tap
      - name: Run development gates against downloaded acceptance
        run: |
          set -o pipefail
          python3 scripts/verify.py all --acceptance-shard ${{ matrix.part }}/8 2>&1 | tee evidence/gates.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gates-part-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/gates-install.log
            evidence/gates.log
          if-no-files-found: warn
          retention-days: 14

  mutations:
    name: gate mutation tests
    needs: [acceptance-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Clear mutation output paths before installation
        run: rm -f evidence/gate-mutations.log evidence/mutations-install.log
      - name: Remove checked-in receipts before artifact download
        run: rm -f evidence/acceptance.json evidence/communications.tap
      - uses: actions/download-artifact@v8
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Require this run's acceptance receipts
        run: |
          test -s evidence/acceptance.json
          test -s evidence/communications.tap
      # The Python mutation suite re-executes a Node acceptance suite in one upstream-receipt case.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies for mutation tests
        run: |
          set -o pipefail
          npm ci 2>&1 | tee evidence/mutations-install.log
      - name: Run fail-closed gate mutation tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p '*_test.py' 2>&1 | tee evidence/gate-mutations.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/mutations-install.log
            evidence/gate-mutations.log
          if-no-files-found: warn
          retention-days: 14

  accountability:
    name: accountability
    needs: [acceptance, acceptance-merge, gates, mutations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every accountability job to succeed
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          MERGE_RESULT: ${{ needs.acceptance-merge.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          MUTATIONS_RESULT: ${{ needs.mutations.result }}
        run: |
          printf 'acceptance: %s, complete receipt: %s, gates: %s, mutations: %s\n' "$ACCEPTANCE_RESULT" "$MERGE_RESULT" "$GATES_RESULT" "$MUTATIONS_RESULT"
          test "$ACCEPTANCE_RESULT" = success
          test "$MERGE_RESULT" = success
          test "$GATES_RESULT" = success
          test "$MUTATIONS_RESULT" = success
