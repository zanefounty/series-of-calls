name: Feature request
description: A proposal for a synthetic training scenario or mechanic.
title: "[feature] "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Proposals should describe the learner's task, the simulated evidence, and what should block a false pass. Cite public sources for real-world context; do not include private operational data.
        **One idea per issue, please.**
  - type: dropdown
    id: area
    attributes:
      label: Part of the game
      options:
        - Configuration and provisioning
        - Calling and messaging
        - Workforce and customer service
        - Products and integrations
        - Information boundaries
        - Commercial operations
        - Physical transport
        - Learning and assessment
        - Something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve, or what is missing?
      description: For example "The room setup exercise does not show which observed dependency blocks provisioning."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would it work in the game?
    validations:
      required: true
  - type: textarea
    id: real
    attributes:
      label: How does this work in real life? (optional)
      description: Links, war stories and real-world numbers make an idea much easier to model well.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and nobody suggested this yet.
          required: true
        - label: This issue is about one idea only.
          required: true
