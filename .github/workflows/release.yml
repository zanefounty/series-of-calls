name: Publish GitHub Pages
on:
  workflow_dispatch:
    inputs:
      publication:
        description: 'Preview publishes the incomplete app; release requires full completion.'
        type: choice
        options: [preview, release]
        default: preview
        required: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    name: publication test ${{ matrix.part }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --shard ${{ matrix.part }}/4
  build:
    needs: [tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate publication choice
        env:
          PUBLICATION: ${{ inputs.publication }}
        run: |
          case "$PUBLICATION" in preview|release) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run evidence
      - run: npm run check:all
      - name: Full product release gate
        if: inputs.publication == 'release'
        run: npm run check:release
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: bash scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - run: python3 scripts/check-pages-artifact.py _site
      - run: python3 scripts/check-secrets.py --gitleaks "$RUNNER_TEMP/gitleaks" --artifact _site
      - name: Record publication scope
        env:
          PUBLICATION: ${{ inputs.publication }}
        run: echo "Publishing $PUBLICATION from $GITHUB_SHA. Preview publication does not certify full product completion." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
