name: Observe upstream
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      observed: ${{ steps.observation.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: observation
        run: python3 scripts/observe-upstream.py
      - run: python3 scripts/verify.py upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-observation-${{ github.run_id }}
          path: |
            maintenance/upstream/register.json
            maintenance/upstream/commits.json
            maintenance/upstream/tree.json
            maintenance/upstream/comparison.json
            maintenance/upstream/releases.json
            maintenance/upstream/history/
  persist:
    needs: observe
    if: ${{ always() && needs.observe.outputs.observed == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: bot/upstream-observation-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: upstream-observation-${{ github.run_id }}
          path: /tmp/observation
      - name: Validate observation data with trusted code
        run: python3 scripts/accept-observation.py upstream /tmp/observation
      - name: Regenerate source obligations with trusted generators
        run: |
          python3 scripts/generate-spec.py
          python3 scripts/audit-mapping.py
          python3 scripts/verify.py coverage
      - name: Propose observation persistence
        run: |
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- maintenance/ spec/generated/ spec/appendices/ spec/audit/ research/generated/
          git -c core.hooksPath=/dev/null commit -m 'Record upstream observations for owner review'
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title 'Review upstream observations' --body-file maintenance/observation-pr.md
          gh workflow run accountability.yml --ref "$BRANCH"
