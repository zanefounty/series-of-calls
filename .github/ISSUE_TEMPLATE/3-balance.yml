name: Balance or realism
description: A synthetic price, outcome, or operational result looks inconsistent with its stated rules.
title: "[balance] "
labels: [balance, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What feels off?
      description: For example "Overland waves between continents are cheaper than subsea, but in real life it's the other way round."
    validations:
      required: true
  - type: textarea
    id: real
    attributes:
      label: Public evidence or synthetic rule
      description: Link dated public material or name the documented rule. Do not provide private network or customer data.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would you change? (optional)
  - type: input
    id: version
    attributes:
      label: Preview version
      description: Shown on the training console.
      placeholder: "0.1.0-preview.1"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not already reported.
          required: true
        - label: This issue is about one topic only.
          required: true
