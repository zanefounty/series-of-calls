<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Proposed Series of Calls campaign screen</title>
<desc id="desc">An illustrative game screen with a persistent treasury and service HUD, goals and deals on the left, a customer service map in the centre, and a costed incident decision on the right. This is a specification wireframe, not a running game. All figures are fictional.</desc>
<defs>
 <pattern id="waves" width="100" height="70" patternUnits="userSpaceOnUse"><path d="M10 36q18 9 36 0m18 18q12 6 24 0" fill="none" stroke="#9BE2F2" stroke-width="3" opacity=".6"/></pattern>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E2640"/></marker>
 <style>
  text{font-family:Arial,sans-serif;fill:#1E2640}.small{font-size:13px}.body{font-size:15px}.label{font-size:12px;font-weight:bold;letter-spacing:.5px}.title{font-family:'Trebuchet MS',Arial,sans-serif;font-size:22px;font-weight:bold}.num{font-size:23px;font-weight:bold}.card{fill:white;stroke:#1E2640;stroke-width:3}.muted{fill:#55608A}.button{fill:#FFD23F;stroke:#1E2640;stroke-width:2.5}.divider{stroke:#D5DEEC;stroke-width:1.5}.route{fill:none;stroke:#1E2640;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}.voice{fill:none;stroke:#FFD23F;stroke-width:3;stroke-linecap:round}.digital{fill:none;stroke:#7B61FF;stroke-width:4;stroke-linecap:round}
 </style>
</defs>
