name: Training preview bug
description: Something in the synthetic communications exercise is broken or misleading.
title: "[bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more of this you fill in, the faster it gets fixed.
        **One bug per issue, please. Do not include real subscriber data, credentials, or sensitive security details.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what went wrong. Screenshots or a screen recording help a lot. Drag them into this box.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do right before it happened? Use synthetic identities, numbers, and customer records only.
      placeholder: |
        1. Open the communications training exercise
        2. Apply a synthetic configuration change
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Preview version
      description: Shown on the training console.
      placeholder: "0.1.0-preview.1"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Phone
        - Tablet
        - Desktop or laptop
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Firefox 159 on Android 16, Safari on iOS 26.1, Chrome 141 on Windows…"
    validations:
      required: true
  - type: dropdown
    id: installed
    attributes:
      label: Installed as an app?
      description: Did you add Series of Calls to your home screen, or do you play in a browser tab?
      options:
        - Browser tab
        - Not sure
    validations:
      required: true
  - type: textarea
    id: save
    attributes:
      label: Sanitized synthetic save (optional)
      description: Attach only an export using fictional identities, numbers and cases. Inspect it for personal data and credentials first.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this one is not already reported.
          required: true
        - label: This issue is about one bug only.
          required: true
